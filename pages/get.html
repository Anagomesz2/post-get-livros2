<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Lista de livros</title>
        <link rel="stylesheet" href="../css/get.css">
        <script src="../js/get.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Lista de livros</h1>
            <p>Veja abaixo a lista de livros!</p>
        </header>
        <main>
            <p><a href="../index.html">Voltar para o cadastro</a></p>
            <section id="container-titulo-lista">
                <h2 id="titulo-lista">Livros cadastrados</h2>
                <p>Os livros são exibidos automaticamente ao abrir a página</p>
                <p id="resposta"></p>
                <ul id="lista-livros"></ul>
            </section>
        </main>


        <template id="modelo-livro">
            <li>
                <section class="card-capa">
                    <img class="imagem-livro" alt=" " />
                </section>
                <section class="card-conteudo">
                <h3 class="nome"></h3>
                <p><strong>Nome:</strong> <span class="nome"></span></p>
                <p><strong>Genero:</strong> <span class="genero"></span></p>
                <p><strong>Ano:</strong> <span class="ano_publicacao"></span></p>
                <p><strong>Autor:</strong> <span class="autor"></span></p>
                <p><strong>Número de Páginas:</strong> <span class="numero_paginas"></span></p>
                </section>
            </li>
        </template>
    </body>
</html>
